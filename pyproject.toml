[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "octri"
version = "0.0.0"
description = "Server-side error monitoring for Python backends (Flask, FastAPI, Django). Reports backend errors to your Octri monitoring project and links them to client SDK errors via W3C trace context."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Octri" }]
keywords = ["monitoring", "observability", "error-tracking", "octri", "apm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://octri.dev"
Documentation = "https://docs.octri.dev/docs"
Support = "https://octri.dev/support"
Repository = "https://github.com/octridev/octri-python"

[project.optional-dependencies]
flask = ["flask>=2.0"]
fastapi = ["starlette>=0.20"]

[tool.setuptools.packages.find]
include = ["octri*"]

[tool.setuptools.package-data]
octri = ["py.typed"]
