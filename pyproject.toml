[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "octri"
version = "0.0.0"
description = "Server-side error monitoring for Python backends (Flask, FastAPI, Django). Reports backend errors to your Octri monitoring project and links them to client SDK errors via W3C trace context."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
flask = ["flask>=2.0"]
fastapi = ["starlette>=0.20"]

[tool.setuptools.packages.find]
include = ["octri*"]

[tool.setuptools.package-data]
octri = ["py.typed"]
